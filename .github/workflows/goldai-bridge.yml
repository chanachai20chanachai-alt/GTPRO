name: GoldAI Python bridge checks
on:
  pull_request:
    paths:
      - 'GoldAI/bridge/**'
      - '.github/workflows/goldai-bridge.yml'
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r GoldAI/bridge/requirements.txt
      - run: python -m compileall -q GoldAI/bridge
      - run: python -m unittest discover -s GoldAI/bridge/tests -v
